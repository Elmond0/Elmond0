name: Generate Language Chart

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"
      - ".github/scripts/langchart.py"
      - ".github/scripts/orbit.py"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # continue-on-error tiene i due grafici indipendenti: se uno fallisce
      # l'altro viene comunque generato e committato.
      - name: Build language donut chart
        continue-on-error: true
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: profile/languages.svg
        run: python3 .github/scripts/langchart.py

      - name: Build language orbit chart
        continue-on-error: true
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORBIT_OUT: profile/orbit.svg
        run: python3 .github/scripts/orbit.py

      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg profile/orbit.svg
          git commit -m "chore: update language charts" || exit 0
          git pull --rebase --autostash
          git push
